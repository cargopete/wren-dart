# yatr - https://github.com/cargopete/yatr

[settings]
cache = true

# Not cached: .dart_tool points into the pub cache, which yatr cannot see.
[tasks.deps]
desc = "Resolve packages (dart pub get)"
run = ["dart pub get"]
no_cache = true

[tasks.fmt]
desc = "Format the tree"
run = ["dart format ."]
no_cache = true

[tasks.fmt-check]
desc = "Fail if the tree is unformatted"
run = ["dart format --output=none --set-exit-if-changed ."]
sources = ["lib/**/*.dart", "test/**/*.dart", "example/**/*.dart", "pubspec.yaml"]

[tasks.analyze]
desc = "Static analysis"
depends = ["deps"]
run = ["dart analyze"]
sources = ["lib/**", "test/**", "example/**", "pubspec.yaml", "pubspec.lock", "analysis_options.yaml"]

[tasks.test]
desc = "Unit suite (the integration tests skip without a broker)"
depends = ["deps"]
run = ["dart test"]
sources = ["lib/**", "test/**", "pubspec.yaml", "pubspec.lock"]

[tasks.broker-up]
desc = "Start a local RabbitMQ (guest/guest)"
run = ["docker compose up -d"]
no_cache = true

[tasks.broker-down]
desc = "Stop the local RabbitMQ"
run = ["docker compose down"]
no_cache = true

[tasks.integration]
desc = "Unit and integration suites against a running broker (yatr broker-up first)"
depends = ["deps"]
env = { WREN_INTEGRATION = "1" }
run = ["dart test"]
no_cache = true

# fmt-check is left out: 11 files on main are not formatted for the current dart format.
[tasks.ci]
desc = "analyze, test"
depends = ["analyze", "test"]
run = []
